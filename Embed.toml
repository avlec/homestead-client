[default.general]
chip = "RP2040"

[default.reset]
# halt_afterwards = true

[default.rtt]
enabled = true
# Warning the below can cause gigabytes of data to
# build up without regular cleaning.
# log_enabled = true
up_channels = [
    { channel = 0, mode = "BlockIfFull", format = "Defmt", show_location = true }
]
down_channels = [
    { channel = 0, mode = "BlockIfFull" }
]

[default.flashing]
enabled = false

[default.gdb]
# enabled = true
